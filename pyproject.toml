[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "glaucoma-baseline"
version = "0.1.0"
description = "Extensible fundus classification training and inference"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "torchvision>=0.20", "numpy>=1.24", "scikit-learn>=1.3", "Pillow>=9.1"]

[project.scripts]
glaucoma = "glaucoma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
